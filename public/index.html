<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepCopilot Lite</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f4f6f8;color:#172b4d}header{padding:17px 24px;background:#073b66;color:#fff;font-size:18px;font-weight:700}.layout{max-width:1150px;margin:auto;padding:22px;display:grid;grid-template-columns:260px 1fr 320px;gap:16px}.card{background:#fff;border:1px solid #dce3ea;padding:16px}select,textarea{width:100%;padding:9px;margin:7px 0;border:1px solid #b8c7d4}.action{font-size:21px;color:#124b78;font-weight:600}.why,.answer{background:#eef7fd;border-left:3px solid #1479c9;padding:10px;line-height:1.45}.trace{white-space:pre-wrap;background:#f4f6f8;padding:10px;font:11px Consolas;max-height:260px;overflow:auto}button{background:#1479c9;border:0;color:#fff;padding:8px 10px;cursor:pointer}.muted{color:#5d7085;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body><header>RepCopilot Lite <span class="muted">Local LLM + governed tools</span></header><div class="layout"><aside class="card"><h3>Eligible HCPs</h3><select id="hcp"></select><p class="muted">Eligibility logic: territory aligned, reachable, on target list, and not opted out/no-see.</p></aside><main class="card"><h3>Next best action</h3><div id="action" class="action"></div><p id="why" class="why"></p><p><b>Approved content:</b> <span id="content"></span><br><b>Timing:</b> <span id="timing"></span></p><h3>Ask the co-pilot</h3><textarea id="q">Why is this HCP's Rx dropping and what should I do?</textarea><button id="ask">Ask with LLM</button><div id="answer" class="answer" style="margin-top:12px">Select an HCP to begin.</div></main><aside class="card"><h3>Tool trace</h3><div id="model" class="muted"></div><pre id="trace" class="trace">No execution yet.</pre></aside></div><script>let hcps=[];const $=x=>document.getElementById(x),local=h=>h.trend<=-10?['Plan an in-person PA-support visit',`TRx is down ${Math.abs(h.trend)}%, cadence is overdue (${h.last} days), and a formulary win creates an access opportunity.`,'Approved PA Support Resource','Within 7 days']:['Maintain planned engagement cadence','No urgent trigger outweighs current compliant cadence.','Approved account plan','Next planned touchpoint'];function render(){const h=hcps.find(x=>x.id==$('hcp').value),n=local(h);$('action').textContent=n[0];$('why').textContent=n[1];$('content').textContent=n[2];$('timing').textContent=n[3]}fetch('/api/hcps').then(r=>r.json()).then(x=>{hcps=x;$('hcp').innerHTML=x.map(h=>`<option value="${h.id}">${h.name} · ${h.ta}</option>`);render()});$('hcp').onchange=render;$('ask').onclick=async()=>{const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({hcpId:$('hcp').value,question:$('q').value})}),d=await r.json();$('answer').textContent=d.answer;$('model').textContent='Model: '+(d.model||'configured LLM');$('trace').textContent=d.trace.map(x=>x.tool+'\n'+JSON.stringify(x.output,null,2)).join('\n\n')};</script></body></html>
